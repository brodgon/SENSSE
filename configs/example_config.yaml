# ==========================================
# Head & Neck configuration
# ==========================================

experiment_name: "SENSSE_HNC"

seed: 42
data_dir: "/PATH/DATA"

output_dir: "PATH/OUTPUT"


height: 512
width: 512
num_slices: 5
num_classes: 5

interaction: "syn2seg"

batch_size: 4

epochs: 150

lr: 0.0001

train_split: 0.8

steps_per_epoch: 100
validation_steps: 20

num_aug: 2

warmup_epochs: 50

max_kl_weight: 0.01

evidential_weight: 0.01

save_best_only: true

save_predictions_every: 10
